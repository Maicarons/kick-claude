name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: node dist/cli.js --version

  action:
    name: action bundle and harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The committed action/cli.js must match the current sources
        run: bun run scripts/check-action-bundle.ts
      - name: Exercise the action entry point like a runner does
        run: bun run scripts/action-check.ts
      - name: Smoke test the action bundle on Node
        run: node action/cli.js --version

  self-test:
    name: run the action on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Executes action.yml for real: runtime version, input plumbing, outputs.
      - id: kick-claude
        uses: ./
        with:
          command: scan
          fail-on-findings: false
      - name: Outputs are wired up
        run: |
          test "${{ steps.kick-claude.outputs.found }}" = "false"
          test "${{ steps.kick-claude.outputs.commits-seen }}" != ""
          echo "found=${{ steps.kick-claude.outputs.found }}"