name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: CLI reports the package version (tag pushes must match)
        shell: bash
        run: |
          reported=$(node dist/cli.js --version)
          pkg_version=$(node -p "require('./package.json').version")
          echo "CLI reports: $reported"
          echo "package.json: $pkg_version"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_version="${{ github.ref_name }}"
            tag_version="${tag_version#v}"
            echo "pushing tag -> expected version $tag_version"
            if [ "$reported" != "$pkg_version" ] || [ "$pkg_version" != "$tag_version" ]; then
              echo "error: version mismatch (cli=$reported pkg=$pkg_version tag=$tag_version)"
              exit 1
            fi
          else
            echo "not a tag push - skipping version gate"
          fi

  action:
    name: action bundle and harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The committed action/cli.js must match the current sources
        run: bun run scripts/check-action-bundle.ts
      - name: Exercise the action entry point like a runner does
        run: bun run scripts/action-check.ts
      - name: Smoke test the action bundle on Node
        run: node action/cli.js --version

  self-test:
    name: run the action on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Executes action.yml for real: runtime version, input plumbing, outputs.
      - id: kick-claude
        uses: ./
        with:
          command: scan
          fail-on-findings: false
      - name: Outputs are wired up
        run: |
          # This repository has no Claude artifacts, so `found` must be false.
          test "${{ steps.kick-claude.outputs.found }}" = "false"
          # `result` is the JSON report and is always emitted for scan. Write it
          # with single quotes: the JSON itself contains double quotes.
          echo '${{ steps.kick-claude.outputs.result }}' > report.json
          jq -e '.counts.worktree == 0' report.json